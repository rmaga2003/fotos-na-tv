name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Instalar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3
        with:
          # O default da action inclui o pacote "tools", que a Google aposentou.
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # A chave de assinatura vem dos secrets do repositorio. Sem ela o build
      # ainda funciona (assina com a chave de debug), mas quem ja tiver o app
      # instalado precisa desinstalar antes de atualizar.
      - name: Preparar chave de assinatura
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Assinando com a chave de release."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Sem KEYSTORE_BASE64 nos secrets - o APK sai assinado com a chave de debug."
          fi

      - name: Build do APK
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.present == 'true' && 'release.keystore' || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Renomear o APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/fotos-na-tv.apk
          ls -lh dist/

      - name: Publicar como artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: fotos-na-tv-apk
          path: dist/fotos-na-tv.apk
          if-no-files-found: error

      - name: Criar release (somente em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/fotos-na-tv.apk
          generate_release_notes: true
          body: |
            ## Fotos na TV — ${{ github.ref_name }}

            **No Fire TV:** abra o app **Downloader** e digite o código **6387552**.
            Ele aponta sempre para a release mais recente, então já traz esta versão.

            Ou baixe o `fotos-na-tv.apk` abaixo e instale manualmente.
            Passo a passo completo em https://rmaga2003.github.io/fotos-na-tv/
