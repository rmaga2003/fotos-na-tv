<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0718">
<title>Álbum da Festa</title>
<link rel="stylesheet" href="/static/base.css">
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="dot">📸</span><span id="brandTitle">Álbum da Festa</span></div>
  <nav class="navlinks">
    <a href="/upload">Enviar</a>
    <a href="/album" class="active">Álbum</a>
  </nav>
</div>

<div class="wrap">
  <div class="stats-row">
    <div class="stat"><div class="k">Fotos</div><div class="v" id="total">0</div></div>
    <div class="stat"><div class="k">Última</div><div class="v" id="last">--</div></div>
  </div>

  <div class="card">
    <h2>Todas as fotos</h2>
    <p class="muted">Toque numa foto para ver grande e salvar no seu celular.</p>
    <div class="spacer"></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty">Ainda não tem nenhuma foto. Seja o primeiro! 🎉</div>
  </div>
</div>

<div class="viewer" id="viewer">
  <img id="viewerImg" alt="">
  <div class="bar">
    <button class="btn secondary" id="prevBtn">‹ Anterior</button>
    <a class="btn" id="saveBtn" download>⬇ Salvar no celular</a>
    <button class="btn secondary" id="nextBtn">Próxima ›</button>
  </div>
  <div class="bar">
    <button class="btn secondary small" id="closeBtn">Fechar</button>
  </div>
  <div class="muted" id="viewerMeta" style="margin-top:10px"></div>
</div>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var photos = [];
  var revision = -1;
  var current = -1;

  fetch("/api/info").then(function (r) { return r.json(); }).then(function (info) {
    var title = (info.settings && info.settings.eventTitle) || "Álbum da Festa";
    $("brandTitle").textContent = title;
    document.title = title;
  }).catch(function () {});

  function relative(ts) {
    var diff = Date.now() - ts;
    if (diff < 60000) return "agora mesmo";
    var min = Math.floor(diff / 60000);
    if (min < 60) return "há " + min + " min";
    var h = Math.floor(min / 60);
    if (h < 24) return "há " + h + (h === 1 ? " hora" : " horas");
    var d = Math.floor(h / 24);
    return "há " + d + (d === 1 ? " dia" : " dias");
  }

  function stamp(ts) {
    var d = new Date(ts);
    return d.toLocaleString("pt-BR", {
      day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"
    });
  }

  function render() {
    $("total").textContent = photos.length;
    $("empty").style.display = photos.length ? "none" : "";
    $("last").textContent = photos.length ? relative(photos[photos.length - 1].timestamp) : "--";

    var html = "";
    // mais recentes primeiro
    for (var i = photos.length - 1; i >= 0; i--) {
      var p = photos[i];
      html += '<div class="tile" data-i="' + i + '">' +
                '<img loading="lazy" src="' + p.thumb + '" alt="">' +
                (p.author ? '<div class="who">' + escapeHtml(p.author) + "</div>" : "") +
              "</div>";
    }
    $("grid").innerHTML = html;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function open(i) {
    if (i < 0 || i >= photos.length) return;
    current = i;
    var p = photos[i];
    $("viewerImg").src = p.url;
    $("saveBtn").href = p.url;
    $("saveBtn").setAttribute("download", p.name);
    $("viewerMeta").textContent = (p.author ? p.author + " · " : "") + stamp(p.timestamp);
    $("viewer").classList.add("show");
  }

  function close() {
    $("viewer").classList.remove("show");
    $("viewerImg").src = "";
  }

  $("grid").addEventListener("click", function (e) {
    var tile = e.target.closest(".tile");
    if (tile) open(parseInt(tile.getAttribute("data-i"), 10));
  });

  $("closeBtn").addEventListener("click", close);
  $("prevBtn").addEventListener("click", function () { open(current - 1); });
  $("nextBtn").addEventListener("click", function () { open(current + 1); });

  document.addEventListener("keydown", function (e) {
    if (!$("viewer").classList.contains("show")) return;
    if (e.key === "Escape") close();
    if (e.key === "ArrowLeft") open(current - 1);
    if (e.key === "ArrowRight") open(current + 1);
  });

  function load() {
    fetch("/api/photos?limit=1000", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.revision === revision) return;
        revision = data.revision;
        photos = data.photos || [];
        render();
      })
      .catch(function () {});
  }

  load();
  setInterval(load, 8000);
})();
</script>
</body>
</html>
